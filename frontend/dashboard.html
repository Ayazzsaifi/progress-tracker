<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script>
        if(!localStorage.getItem("token")){
            window.location.href="index.html"
        }
    </script>
        <link rel="stylesheet" href="style.css">

</head>
<body>
  <div class="container">
    <p id="streak"></p>
    <form id="log-session">
      <input type="text" placeholder="Topic" id="topic-log">
      <textarea name="notes" id="notes-log"></textarea>
      <button id="submit-log" type="button">Submit</button>
    </form>
  </div>
  <div id="past-session"></div>
  <script src="dashboard.js"></script>
</body>
</html>
